# Reverse proxy for the web UI on HF Spaces.
# Runs as the non-root `node` user, so pid/logs/temp all live under /tmp.
# Fixes the slow Python proxy: keepalive to upstream, gzip, streaming, websockets.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Temp paths writable by the non-root user
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 120;
    client_max_body_size 100m;

    # gzip — shrink the JS/CSS bundles (the big mobile win)
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json application/xml
                      application/wasm image/svg+xml font/woff font/woff2;

    # Empty Connection header for normal reqs (enables upstream keepalive);
    # "upgrade" for websocket requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    upstream backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 7860;
        server_name _;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Host rewrite mirrors the old proxy (dodges host checks → no black screen)
            proxy_set_header Host              127.0.0.1:8000;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # WebSocket + upstream keepalive
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Stream token-by-token LLM responses instead of buffering
            proxy_buffering  off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;

            # Don't leak backend identity
            proxy_hide_header X-Powered-By;
        }
    }
}
